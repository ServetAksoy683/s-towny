# =========================================
#  S-Towny Config
# =========================================
language: turkish

# =========================================
#  Ekonomi (Vault uzerinden calisir - Essentials dahil her ekonomi pluginiyle uyumlu)
# =========================================
economy:
  town-creation-cost: 500
  kingdom-creation-cost: 2500
  royal-creation-cost: 10000
  # Ilk arazi (chunk) maliyeti; her yeni claim'de bu oranla carpilir (katlanarak artar).
  claim-base-cost: 100
  claim-cost-multiplier: 1.4
  # Bir kasabanin sahip olabilecegi azami arazi sayisi (0 = sinirsiz).
  max-claims-per-town: 50
  # Her arazi icin gunluk bakim ucreti (kasaba kasasindan, ekonomiden silinir).
  upkeep-per-claim-per-day: 2.0
  kingdom-upkeep-per-day: 50.0
  royal-upkeep-per-day: 200.0
  # Vergi/bakim dongusu kac dakikada bir calissin (1440 = 24 saat). Test icin 1-2 yap.
  tax-interval-minutes: 1440

# =========================================
#  Dunya kisitlamasi
# =========================================
world-restriction:
  # true ise S-Towny sadece asagidaki dunyalarda calisir (komutlar, scoreboard, claim).
  enabled: false
  worlds:
    - "world"

# =========================================
#  Arazi korumasi
# =========================================
protection:
  enabled: true

# =========================================
#  Dynmap entegrasyonu
# =========================================
dynmap:
  enabled: true
  marker-set-name: "S-Towny Kasabalari"
  fill-color: "#55ff55"
  fill-opacity: 0.35
  line-color: "#00aa00"
  line-opacity: 0.8

# =========================================
#  Scoreboard
# =========================================
scoreboard:
  enabled-by-default: true
  # Baska bir scoreboard plugini ile cakisiyorsa 1 birak (en sik guncelleme).
  update-interval-seconds: 1

# =========================================
#  Ses efektleri (sound: "" yaparak kapatabilirsin)
# =========================================
sounds:
  success:
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.3
  error:
    sound: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 0.8
  claim:
    sound: "BLOCK_ANVIL_USE"
    volume: 0.8
    pitch: 1.2
  bank:
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0
  invite:
    sound: "BLOCK_NOTE_BLOCK_BELL"
    volume: 1.0
    pitch: 1.0
  create:
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 1.0
    pitch: 1.0
  tax:
    sound: "BLOCK_NOTE_BLOCK_BASS"
    volume: 0.6
    pitch: 0.9

